[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "freight-rail-data-pipeline"
version = "0.1.0"
description = "Multi-source data pipeline for freight rail and ocean container shipping rates."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Zanderl1987"},
]

keywords = ["freight", "rail", "shipping", "data-pipeline", "supply-chain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.31",
    "pydantic>=2.5",
    "pyarrow>=14.0",
    "pandas>=2.2", # scripts/forecast_waybill.py uses groupby.apply(include_groups=)
    "sodapy>=2.2",
    "python-dotenv>=1.0",
    "click>=8.1",
    "rich>=13.7",
    "streamlit>=1.28",
    "plotly>=5.18",
    "httpx>=0.26",
    "tenacity>=8.2",
    "pymupdf>=1.24",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "responses>=0.25",
    "black>=24.0",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.5",
]
test = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-mock>=3.12",
    "responses>=0.25",
]
hf = [
    "huggingface_hub>=0.35",
]
# Offline analysis scripts (scripts/forecast_waybill.py). Not needed to run
# the pipeline itself, so kept out of the base install.
analysis = [
    "duckdb>=1.0",
    "xgboost>=2.0",
    "scikit-learn>=1.3",  # xgboost's sklearn API (XGBRegressor) requires it
    "numpy>=1.26",
]

[project.scripts]
freight-pipe = "freight_rail_pipeline.reporting.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=freight_rail_pipeline"
markers = [
    "integration: marks tests that hit real APIs (skipped by default)",
    "slow: marks slow tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: asserts are the test idiom. S110: cleanup/failure-path exception swallowing.
"tests/**" = ["S101", "S110"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
